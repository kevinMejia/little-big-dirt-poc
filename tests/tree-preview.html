<!doctype html><html><head><meta charset="utf-8"><title>Tree collision visual check</title><style>body{margin:0;background:#b6dfef;font:18px system-ui}p{position:absolute;left:24px;top:12px;background:#183b42;color:white;padding:16px;border-radius:12px}</style></head><body><p>Tree collision check · gentle rebound, bending trunk, scattered leaves</p><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js';
import {TreeCollisionSystem} from '../TreeCollisionSystem.js';
import {BackhoeLoader} from '../BackhoeLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xb6dfef);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x637347,2));const sun=new THREE.DirectionalLight(0xffefce,2.4);sun.position.set(5,12,6);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:0x87b95b}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const tree=new THREE.Group();tree.position.set(0,0,5);scene.add(tree);
const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25,.3,2.4,10),new THREE.MeshStandardMaterial({color:0x91623e}));trunk.position.y=1.2;tree.add(trunk);
for(let i=0;i<2;i++){const foliage=new THREE.Mesh(new THREE.ConeGeometry(1.5-i*.3,2.8,7),new THREE.MeshStandardMaterial({color:i?0x438659:0x326e4b}));foliage.position.y=2.6+i*1.3;foliage.castShadow=true;tree.add(foliage);}
const model=new BackhoeLoader();scene.add(model.group);const system=new TreeCollisionSystem(scene);system.addTree(tree,.3,4);
const knockdown=new URLSearchParams(location.search).has('knockdown');
system.move(model.group.position,0,21,.2,{radius:1.2,rear:-2.4,front:2.75},knockdown?{baseMaxSpeed:21,treeKnockdownSpeedPercent:60}:{});
if(knockdown){for(let i=0;i<18;i++)system.update(.05);document.querySelector('p').textContent='Tree knockdown check · soft drive-through, fallen tree, scattered leaves';}else system.update(.16);model.update(0);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(11,7,14);camera.lookAt(0,2,2);renderer.render(scene,camera);
</script></body></html>
