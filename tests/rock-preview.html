<!doctype html><html><head><meta charset="utf-8"><title>Rock interaction visual check</title><style>body{margin:0;font:18px system-ui;background:#b6dfef}p{position:absolute;left:20px;top:12px;background:#183b42;color:white;padding:14px 18px;border-radius:12px}#labels{position:absolute;bottom:28px;left:0;right:0;display:flex;justify-content:space-around;color:#fff;font-weight:800}span{padding:10px 18px;background:#183b42cc;border-radius:12px}</style></head><body><p>Rock reactions · gentle bumps, visible cracks, chunky fragments</p><div id="labels"><span>Wiggle + dust</span><span>Cracked</span><span>Shattered</span></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js';
import {RockInteractionSystem} from '../RockInteractionSystem.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xb6dfef);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x758563,2));const sun=new THREE.DirectionalLight(0xffefce,2.4);sun.position.set(-5,12,6);sun.castShadow=true;sun.shadow.camera.left=-15;sun.shadow.camera.right=15;sun.shadow.camera.top=15;sun.shadow.camera.bottom=-15;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0x87b95b}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const rocks=new RockInteractionSystem(scene);const a=rocks.addRock(-4.5,0,1.65),b=rocks.addRock(0,0,1.65),c=rocks.addRock(4.5,0,1.65);rocks.hit(a,{nx:0,nz:-1},2,'bump');b.state='CRACKED';b.cracks.visible=true;rocks.hit(b,{nx:0,nz:-1},7,'crack');rocks.shatter(c,0,1,16);for(let i=0;i<9;i++)rocks.update(.025);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(0,7,16);camera.lookAt(0,.6,0);renderer.render(scene,camera);
</script></body></html>
