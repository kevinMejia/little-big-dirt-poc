  ].join('\n');}
 });
}

function rockImpactSound(strength,kind){

  if(kind!=='bump'){const buffer=audio.createBuffer(1,Math.floor(audio.sampleRate*.22),audio.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,2)*(Math.sin(i/audio.sampleRate*65)>0?1:.15);const noise=audio.createBufferSource(),filter=audio.createBiquadFilter(),g=audio.createGain();noise.buffer=buffer;filter.type='lowpass';filter.frequency.value=kind==='break'?900:1600;g.gain.value=.045;noise.connect(filter);filter.connect(g);g.connect(audio.destination);noise.start();noise.onended=()=>{noise.disconnect();filter.disconnect();g.disconnect()};}}catch(e){}
}
function treeImpactSound(strength,kind='wobble'){

  if(!audio||audio.state!=='running')return;

  try{

    const now=audio.currentTime,osc=audio.createOscillator(),gain=audio.createGain();

    osc.type=kind==='fall'?'triangle':'sine';osc.frequency.setValueAtTime(kind==='fall'?480:strength<3?220:360,now);osc.frequency.exponentialRampToValueAtTime(85,now+.2);

    gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.045,now+.008);gain.gain.exponentialRampToValueAtTime(.0001,now+.3);

    osc.connect(gain);gain.connect(audio.destination);osc.start(now);osc.stop(now+.32);osc.onended=()=>{osc.disconnect();gain.disconnect()};

    const buffer=audio.createBuffer(1,Math.floor(audio.sampleRate*.22),audio.sampleRate),data=buffer.getChannelData(0);

    for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);

    const noise=audio.createBufferSource(),filter=audio.createBiquadFilter(),rustle=audio.createGain();noise.buffer=buffer;filter.type='bandpass';filter.frequency.value=kind==='fall'?900:1700;filter.Q.value=.6;rustle.gain.value=kind==='fall'?.024:.016;

    noise.connect(filter);filter.connect(rustle);rustle.connect(audio.destination);noise.start(now);noise.onended=()=>{noise.disconnect();filter.disconnect();rustle.disconnect()};

  }catch(e){}

}

 try{const now=audio.currentTime,osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.setValueAtTime(95,now);osc.frequency.exponentialRampToValueAtTime(38,now+.22);gain.gain.setValueAtTime(Math.min(.06,impact*.002),now);gain.gain.exponentialRampToValueAtTime(.0001,now+.3);osc.connect(gain);gain.connect(audio.destination);osc.start(now);osc.stop(now+.31);osc.onended=()=>{osc.disconnect();gain.disconnect();};}catch(error){}
}

document.querySelector('#gameLoading').dataset.phase='turbo-assets';
await turboReady;
const turboStatus=document.createElement('div');turboStatus.id='turboStatus';turboStatus.hidden=true;turboStatus.setAttribute('aria-live','off');document.body.append(turboStatus);
const clock=new THREE.Clock(),camTarget=new THREE.Vector3(),targetPos=new THREE.Vector3(),up=new THREE.Vector3(0,1,0);

function update(dt){const previousHeading=heading;const cfg=configs[index];treeCollisions.setVehicles([{position,heading,bounds:cfg.collision,airborne:!!flight}]);treeCollisions.update(dt);rockInteractions.setVehicles([{position,heading,bounds:cfg.collision,airborne:!!flight}]);rockInteractions.update(dt);const pad=navigator.getGamepads?.()[0];const ax=pad?.axes?.[0]||0;

const drivingInput=controls.read(speed,pad);
const forward=drivingInput.accelerate,back=drivingInput.reverse,brake=drivingInput.brake,emergencyBrake=drivingInput.emergencyBrake;
steer=smoothDrivingSteering(steer,drivingInput,cfg,dt);

const groundY=surfaceHeight(position.x,position.z);

let slope=0;



if(physicsMode==='original'){
boundaryCannon.rearm(position,world-mapSettings.boundaryInset);
if(!flight){
let thrust=forward?1:back?-1:0;

const hill=hillPhysics.update({x:position.x,z:position.z,heading,speed,thrust,config:cfg.hill,dt});slope=hill.grade;

const driveScale=getSpeedMultiplier(cfg.hill.speedAdjustmentPercent);

if(brake)acceleration-=Math.sign(speed)*Math.min(Math.abs(speed)/Math.max(dt,.001),cfg.brakeDeceleration);

const previousSpeed=speed;

speed+=acceleration*dt;speed-=speed*cfg.drag*dt*.08;speed=hillPhysics.limitSpeed(speed,cfg.max*driveScale,cfg.reverse*driveScale,dt,previousSpeed);

if(emergencyBrake)speed=Math.sign(speed)*Math.max(0,Math.abs(speed)-cfg.emergencyBrakeDeceleration*dt);

if(!forward&&!back)speed=applyReleaseDeceleration(speed,dt,cfg.hill);

heading-=steer*cfg.turn*Math.min(Math.abs(speed)/cfg.steeringFullSpeed,1)*dt*Math.sign(speed||1);

const previousX=position.x,previousZ=position.z;

// Shared short movement steps let both obstacle systems correct the same motion.
const movementSteps=Math.max(1,Math.ceil(Math.abs(speed)*dt/.16)),movementDt=dt/movementSteps;
for(let step=0;step<movementSteps;step++){
 const startX=position.x,startZ=position.z;
 speed=treeCollisions.move(position,heading,speed,movementDt,cfg.collision,{baseMaxSpeed:cfg.max,treeKnockdownSpeedPercent:cfg.hill.treeKnockdownSpeedPercent});
 speed=rockInteractions.resolveMovement(position,startX,startZ,heading,speed,movementDt,cfg.collision,{baseMaxSpeed:cfg.max,...cfg.hill});
 const contact=boundaryMotion.resolve(position,heading,speed,world-mapSettings.boundaryInset,cfg.collision,cfg.hill,thrust);
 if(contact.nx||contact.nz){position.y=surfaceHeight(position.x,position.z)-.09;if(!launchFromBoundary())speed=contact.speed;break;}
}

hillPhysics.recordTravel(position.x-previousX,position.z-previousZ);

position.y=surfaceHeight(position.x,position.z)-.09;
}
if(flight){
 const state=boundaryCannon.update(dt,position,surfaceHeight,steer,world-mapSettings.boundaryInset);
 flight=boundaryCannon.flight;
 if(state.unrecoverable){reset();}
 else if(state.landed){
   speed=state.speed;heading=state.heading;hillPhysics.reset();bodyFeedback.reset();bodyFeedback.landingImpact(cfg.hill,state.impact,state.bounce);bodyFeedback.heave.velocity*=1.08;
   surfaceEffects.puff(position.x,position.y+.25,position.z,state.impact);
   landingSound(state.impact);
 }else{
   speed=state.speed;const delta=Math.atan2(Math.sin(state.heading-heading),Math.cos(state.heading-heading));heading+=delta*(1-Math.exp(-1.8*dt));
 }
}

}else{
 const state=rapierController.update(dt,hybridDrivingInput(drivingInput,steer,rapierController.physics.state.airborne));
 position.set(state.position.x,state.position.y,state.position.z);heading=state.heading;speed=state.speed;slope=state.grade;flight=state.airborne?{kind:'rapier',vy:state.verticalSpeed}:null;
 for(const event of state.events)if(event.type==='landing')hybridLandingFeedback(event,index,cfg,bodyFeedback,surfaceEffects,surfaceHeight,landingSound);
}

turboPickups?.update(dt,position,physicsMode==='rapier'?rapierController:null);
const boostRemaining=rapierController?.turbo.remaining??0;
turboStatus.hidden=physicsMode!=='rapier'||boostRemaining<=0;
if(!turboStatus.hidden)turboStatus.textContent=`⚡ TURBO ${boostRemaining.toFixed(1)}s`;

if(physicsMode==='original'){
vehicleRoot.position.copy(position);vehicleRoot.rotation.order='YXZ';vehicleRoot.rotation.y=heading;

const frontH=surfaceHeight(position.x+Math.sin(heading)*2,position.z+Math.cos(heading)*2),backH=surfaceHeight(position.x-Math.sin(heading)*2,position.z-Math.cos(heading)*2);

const rightH=surfaceHeight(position.x+Math.cos(heading)*1.3,position.z-Math.sin(heading)*1.3),leftH=surfaceHeight(position.x-Math.cos(heading)*1.3,position.z+Math.sin(heading)*1.3);

vehicleRoot.rotation.x=THREE.MathUtils.damp(vehicleRoot.rotation.x,flight?0:Math.atan2(backH-frontH,4),5,dt);

vehicleRoot.rotation.z=THREE.MathUtils.damp(vehicleRoot.rotation.z,flight?0:Math.atan2(rightH-leftH,2.6),9,dt);

const debrisTargets=debrisContacts.sample(vehicle,vehicleRoot,groundDebris,cfg.hill,!!flight);
// Body feedback follows terrain alignment on a visual-only parent.
if(!flight)bodyFeedback.update(dt,{speed,yawRate:(heading-previousHeading)/Math.max(dt,.001),groundY:position.y,groundPitch:vehicleRoot.rotation.x,groundRoll:vehicleRoot.rotation.z,config:cfg.hill,debris:debrisTargets});
vehicleVisual.position.y=bodyFeedback.heave.value;vehicleVisual.rotation.set(bodyFeedback.pitch.value,0,bodyFeedback.roll.value);
if(flight){vehicleVisual.position.y=0;vehicleVisual.rotation.x=.12*Math.tanh(flight.vy/12)+Math.sin(flight.elapsed*1.6)*.18*flight.spin;vehicleVisual.rotation.z=Math.sin(flight.elapsed*1.8)*.25*flight.spin;}
// Ground each wheel in its actual parent space, compensating body movement.

vehicleRoot.updateMatrixWorld(true);

const model=vehicle.userData.controller;

if(model){model.setSteering(-steer*.35);if(!emergencyBrake)model.setWheelRotation(model.wheelAngle+speed*dt/(model.wheelReferenceRadius??.65))}

for(const {pivot} of debrisContacts.wheels){const w=pivot.userData.wheel;if(!w)continue;if(flight){const center=vehicleRoot.localToWorld(new THREE.Vector3(w.x,w.r-.12,w.z));pivot.position.copy(pivot.parent.worldToLocal(center));}else {/* Independent contacts grounded below. */}if(!model){pivot.rotation.y=w.z>0?-steer*.35:0;if(!emergencyBrake)pivot.userData.roll.rotation.x+=speed*dt/w.r}}

if(!flight)debrisContacts.ground(vehicleRoot,surfaceHeight,bodyFeedback);
if(model)model.update(dt);
}else{
 if(!flight)bodyFeedback.update(dt,{speed,yawRate:(heading-previousHeading)/Math.max(dt,.001),groundY:0,groundPitch:0,groundRoll:0,config:configs[index].hill});
 rapierController.render(vehicleRoot,vehicleVisual,bodyFeedback,dt);
 // Keep wheel descriptors for tire shadows/dust; disabled debris does no bump queries.
 debrisContacts.sample(vehicle,vehicleRoot,groundDebris,configs[index].hill,!!flight);
 for(let i=0;i<debrisContacts.wheels.length;i++)debrisContacts.wheels[i].compression=rapierController.physics.state.compression[i]??0;
}

stinkyQA?.update(performance.now());
environmentWorld?.update();
polishedLighting.update(position);
contactShading.update(vehicleRoot,debrisContacts,!!flight);
surfaceEffects.update(dt,{position,speed,heading,airborne:!!flight,contacts:debrisContacts,camera,boosted:physicsMode==='rapier'&&boostRemaining>0});

document.querySelector('#status').dataset.idle=String(!flight&&bodyFeedback.landingSeconds<=0&&!emergencyBrake);
document.querySelector('#status').textContent=flight?(physicsMode==='rapier'&&!rapierController.cannonFlight?'AIRBORNE · Dirt jump':'BOUNDARY CANNON · Flying!'):bodyFeedback.landingSeconds>0?'Soft landing · Settling…':emergencyBrake?'EMERGENCY BRAKE · ENGAGED':'Keyboard or gamepad supported';

if(cameraOrbit.pointer===null){const decay=cameraReturnDecay(cameraSettings.cameraReturnSpeedPercent,dt);cameraOrbit.yaw*=decay;cameraOrbit.pitch*=decay;}
const cameraAnchor=physicsMode==='rapier'?vehicleRoot.position:position;
const orbitHeading=(physicsMode==='rapier'?rapierController.cameraHeading:heading)+cameraOrbit.yaw,elevation=chaseElevation+cameraOrbit.pitch;
const behind=new THREE.Vector3(-Math.sin(orbitHeading)*Math.cos(elevation)*chaseDistance,2.4+Math.sin(elevation)*chaseDistance,-Math.cos(orbitHeading)*Math.cos(elevation)*chaseDistance);targetPos.copy(cameraAnchor).add(behind);camera.position.lerp(targetPos,1-Math.exp(-(cameraOrbit.pointer===null?4:12)*dt));camera.position.y=Math.max(camera.position.y,surfaceHeight(camera.position.x,camera.position.z)+1.3);camTarget.set(cameraAnchor.x,cameraAnchor.y+2.4,cameraAnchor.z);camera.lookAt(camTarget);

document.querySelector('#treeTuning').textContent='Physics: '+(physicsMode==='rapier'?'Rapier':'Original')+' · Speed '+Math.round(Math.abs(speed)/cfg.max*100)+'% · Tree knockdown '+cfg.hill.treeKnockdownSpeedPercent+'% ('+(cfg.max*cfg.hill.treeKnockdownSpeedPercent/100).toFixed(1)+' units/s)';

document.querySelector('#speed').innerHTML=Math.round(Math.abs(speed)*2.237)+' <small>MPH</small>';document.querySelector('#terrainInfo').textContent=Math.abs(slope)>.03?(slope>0?'Climbing a hill':'Heading downhill'):'Explore the hills!';

}

function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);wordHunt?.update(dt,physicsMode==='rapier'?vehicleRoot.position:position,garage.open||document.hidden||physicsSelector.disabled);if(!garage.open){update(dt);storybookBackground?.update(dt);groundTextures.update();groundDetails.update(camera.position);renderer.render(scene,camera);if(!physicsSelector.disabled){document.querySelector('#gameLoading').hidden=true;document.querySelector('#gameLoading').dataset.phase='ready';}diagnosticFrames++;const now=performance.now();if(now-diagnosticStart>1000){if(document.body.classList.contains('show-debug'))document.querySelector('#renderTuning').textContent=Math.round(diagnosticFrames*1000/(now-diagnosticStart))+' FPS · '+renderer.info.render.calls+' draws · '+Math.round(renderer.info.render.triangles/1000)+'k triangles';diagnosticFrames=0;diagnosticStart=now;}}}animate();
