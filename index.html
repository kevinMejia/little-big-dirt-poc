<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js';

import { BackhoeLoader } from './BackhoeLoader.js';
import { DirtyGLB } from './assets/dirty/DirtyGLB.js';
import { bindVehicleGarage } from './VehicleGarage.js';

import { TreeCollisionSystem } from './TreeCollisionSystem.js';
import { RockInteractionSystem } from './RockInteractionSystem.js';

import { vehicleConfig, cameraSettings } from './VehicleConfig.js';

import { HillSpeedPhysics } from './HillSpeedPhysics.js';
import { DrivingInput } from './DrivingInput.js';
import { applyReleaseDeceleration } from './VehicleMotion.js';
import { VehicleFeedback, SoftBoundary, cameraReturnDecay, groundVisualWheel } from './VehicleFeedback.js';

const hillPhysics=new HillSpeedPhysics(height);

const scene=new THREE.Scene();scene.background=new THREE.Color(0x9dd9f2);scene.fog=new THREE.Fog(0x9dd9f2,115,340);

const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.1,600);

const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe9f9ff,0x738b53,2.15));

const sun=new THREE.DirectionalLight(0xfff4cf,2.6);sun.position.set(-65,105,40);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-120;sun.shadow.camera.right=120;sun.shadow.camera.top=120;sun.shadow.camera.bottom=-120;sun.shadow.normalBias=.035;scene.add(sun);

const mat=(c,roughness=1)=>new THREE.MeshStandardMaterial({color:c,roughness,flatShading:true});

const green=mat(0x86bc68),road=mat(0xcba46b),yellow=mat(0xf3b926),yellowDark=mat(0xd89b19),orange=mat(0xf18a34),glass=mat(0x91d8e6,.25),rubber=mat(0x292f35),metal=mat(0x68747b),white=mat(0xf4f2e6),red=mat(0xe35a46);

function height(x,z){return 2.6*Math.sin(x*.035)*Math.cos(z*.044)+3.6*Math.sin((x+z)*.018)+1.4*Math.cos(z*.085+x*.027)+.00034*(x*x+z*z)}

function groundNormal(x,z){const e=.7;return new THREE.Vector3(height(x-e,z)-height(x+e,z),2*e,height(x,z-e)-height(x,z+e)).normalize()}

// Map distances are in world units. The terrain spans -220 to +220 on each axis.

const mapSettings={halfSize:220,boundaryInset:15};

const world=mapSettings.halfSize,segments=220,geo=new THREE.PlaneGeometry(world*2,world*2,segments,segments);geo.rotateX(-Math.PI/2);const pos=geo.attributes.position,colors=[];

for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i);pos.setY(i,height(x,z));const path=Math.abs(x-18*Math.sin(z*.025));const c=new THREE.Color(path<5?0xb99563:0x79a956);c.multiplyScalar(1+.055*Math.sin(x*.48)*Math.cos(z*.39));colors.push(c.r,c.g,c.b)}

geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));geo.computeVertexNormals();const terrain=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1}));terrain.receiveShadow=true;scene.add(terrain);

function box(parent,w,h,d,x,y,z,m){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return mesh}

function cylinder(parent,r,len,x,y,z,m){const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,10),m);mesh.rotation.z=Math.PI/2;mesh.position.set(x,y,z);mesh.castShadow=true;parent.add(mesh);return mesh}

const treeCollisions=new TreeCollisionSystem(scene,{groundHeight:height,onImpact:treeImpactSound});

function makeTree(x,z,scale=1){const g=new THREE.Group();g.position.set(x,height(x,z)-.08,z);const trunk=cylinder(g,.22*scale,2.3*scale,0,1.1*scale,0,mat(0x91623e));trunk.rotation.z=0;for(let i=0;i<2;i++){const cone=new THREE.Mesh(new THREE.ConeGeometry((1.45-i*.35)*scale,2.8*scale,7),mat(i?0x438659:0x326e4b));cone.position.y=(2.55+i*1.3)*scale;cone.castShadow=true;g.add(cone)}scene.add(g);treeCollisions.addTree(g,.22*scale,3.5*scale)}

let seed=3184;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}

for(let i=0;i<175;i++){const x=(rand()-.5)*410,z=(rand()-.5)*410;if(Math.abs(x)<20&&Math.abs(z)<20)continue;makeTree(x,z,.65+rand()*.9)}

const rockInteractions=new RockInteractionSystem(scene,{groundHeight:height,onImpact:rockImpactSound});
function makeRock(x,z,s){rockInteractions.addRock(x,z,s);rand();rand();rand()}

for(let i=0;i<80;i++){const x=(rand()-.5)*370,z=(rand()-.5)*370;if(Math.abs(x)<16&&Math.abs(z)<16)continue;makeRock(x,z,.45+rand()*1.2)}

function ramp(x,z,angle){const g=new THREE.Group();g.position.set(x,height(x,z)+.35,z);g.rotation.y=angle;box(g,7,.55,12,0,1.4,0,mat(0xe4a05b)).rotation.x=-.2;scene.add(g)}

ramp(13,-28,.2);ramp(-35,-12,-.7);ramp(35,36,.5);

let dirtyTemplate;
try{dirtyTemplate=await DirtyGLB.load(new URL('./assets/dirty/dirty.glb',location.href).href);}catch(error){console.warn('New backhoe failed to load; trying previous Blender asset',error);try{dirtyTemplate=await DirtyGLB.load(new URL('./assets/dirty/backups/pre-reference-sheet/dirty.glb',location.href).href);}catch(fallbackError){console.error('Blender assets unavailable; using procedural fallback',fallbackError);}}
const start={x:0,z:0,heading:0};

function wheel(g,x,z,r){const pivot=new THREE.Group();pivot.position.set(x,r,z);pivot.userData.wheel={x,z,r};g.add(pivot);const roll=new THREE.Group();pivot.add(roll);pivot.userData.roll=roll;cylinder(roll,r,.55,0,0,0,rubber);cylinder(roll,r*.49,.58,0,0,0,yellowDark);cylinder(roll,r*.19,.61,0,0,0,metal);for(let i=0;i<12;i++){const a=i*Math.PI/6;const tread=box(roll,.57,.09,.2,0,Math.cos(a)*r,Math.sin(a)*r,rubber);tread.rotation.x=-a}return pivot}

function backhoe(){const model=dirtyTemplate?dirtyTemplate.clone():new BackhoeLoader();model.group.userData.controller=model;return model.group}

function garbage(){const g=new THREE.Group();box(g,2.8,.7,6.4,0,1.12,0,metal);box(g,2.75,2.4,3.95,0,2.38,-1.05,mat(0x48a1b4));box(g,2.85,.4,4,0,3.77,-1.05,mat(0x337d91));box(g,2.85,2.35,2.15,0,2.4,2.15,orange);box(g,2.95,.38,2.25,0,3.7,2.15,orange);box(g,2.5,.9,.12,0,2.75,3.28,glass);box(g,2.85,.5,.35,0,1.1,3.36,metal);box(g,2.5,.18,.16,0,1.85,3.4,white);box(g,2.3,.25,.4,0,2,-3.13,metal);

for(const x of [-1.43,1.43])for(const z of [-2.15,-.8,2.25])wheel(g,x,z,.72);

return g}

const configs=[{hill:vehicleConfig.backhoe,name:'Backhoe Loader',mass:8,accel:11,max:21,reverse:9,turn:1.42,drag:.52,grip:3.4,collision:{radius:1.2,rear:-2.4,front:2.75},build:backhoe},{hill:vehicleConfig.garbageTruck,name:'Garbage Truck',mass:19,accel:7,max:17,reverse:7,turn:1.05,drag:.8,grip:2.4,collision:{radius:1.4,rear:-2,front:2.35},build:garbage}];

let index=0,vehicle,position=new THREE.Vector3(start.x,0,start.z),heading=0,speed=0,steer=0,tilt=0;

const vehicleRoot=new THREE.Group();scene.add(vehicleRoot);
const vehicleVisual=new THREE.Group();vehicleRoot.add(vehicleVisual);
const bodyFeedback=new VehicleFeedback(),boundaryMotion=new SoftBoundary();

// Orbit the existing chase camera. Only canvas pointers can own an orbit;
// drive buttons keep their independent pointer capture for multitouch.
const cameraOrbit={yaw:0,pitch:0,pointer:null,x:0,y:0};
const chaseElevation=Math.atan2(5.6,20),chaseDistance=Math.hypot(20,5.6);
const releaseOrbit=()=>{const id=cameraOrbit.pointer;cameraOrbit.pointer=null;if(id!==null&&renderer.domElement.hasPointerCapture(id))renderer.domElement.releasePointerCapture(id);};
renderer.domElement.addEventListener('pointerdown',event=>{if(cameraOrbit.pointer!==null||(event.pointerType==='mouse'&&event.button!==0))return;event.preventDefault();cameraOrbit.pointer=event.pointerId;cameraOrbit.x=event.clientX;cameraOrbit.y=event.clientY;renderer.domElement.setPointerCapture(event.pointerId);});
renderer.domElement.addEventListener('pointermove',event=>{if(event.pointerId!==cameraOrbit.pointer)return;event.preventDefault();cameraOrbit.yaw-=(event.clientX-cameraOrbit.x)*.008;cameraOrbit.yaw=Math.atan2(Math.sin(cameraOrbit.yaw),Math.cos(cameraOrbit.yaw));cameraOrbit.pitch=THREE.MathUtils.clamp(cameraOrbit.pitch+(event.clientY-cameraOrbit.y)*.006,.12-chaseElevation,1.15-chaseElevation);cameraOrbit.x=event.clientX;cameraOrbit.y=event.clientY;});
for(const type of ['pointerup','pointercancel','lostpointercapture'])renderer.domElement.addEventListener(type,event=>{if(event.pointerId===cameraOrbit.pointer)releaseOrbit();});
addEventListener('blur',releaseOrbit);addEventListener('resize',releaseOrbit);addEventListener('orientationchange',releaseOrbit);document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseOrbit();});

function choose(i){hillPhysics.reset();bodyFeedback.reset();boundaryMotion.reset();vehicleVisual.position.set(0,0,0);vehicleVisual.rotation.set(0,0,0);index=i; if(vehicle){if(vehicle.userData.controller)vehicle.userData.controller.dispose();else{vehicleVisual.remove(vehicle);vehicle.traverse(o=>{if(o.isMesh)o.geometry.dispose()})}}vehicle=configs[i].build();vehicleVisual.add(vehicle);if(i===1){for(const x of [-.8,.8]){box(vehicle,.35,.22,.12,x,index===0?1.7:1.85,index===0?2.38:3.43,white);box(vehicle,.3,.18,.12,x,1.35,index===0?-2.4:-3.13,red)}box(vehicle,.16,.85,.16,.7,3.7,-.5,metal);}document.querySelector('#vehicleName').textContent=configs[i].name;document.querySelector('#backhoeBtn').classList.toggle('active',i===0);document.querySelector('#garbageBtn').classList.toggle('active',i===1);speed=0}

function reset(){hillPhysics.reset();bodyFeedback.reset();boundaryMotion.reset();releaseOrbit();cameraOrbit.yaw=cameraOrbit.pitch=0;position.set(0,height(0,0),0);heading=0;speed=0;steer=0}

choose(0);reset();

document.querySelector('#resetBtn').onclick=reset;

const keys=new Set();addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys.add(e.code);if(garage.open)return;if(e.repeat)return;if(e.code==='KeyR')reset();if(e.code==='KeyH')honk()});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>keys.clear());

const controls=new DrivingInput({root:document.querySelector('#mobile'),toggle:document.querySelector('#touchToggle'),keys,actionsRoot:document.querySelector('#vehicleActions'),actionsToggle:document.querySelector('#actionsToggle')});
const garage=document.querySelector('#vehicleGarage'),garageFrame=document.querySelector('#garageFrame');
let garageVehicle=-1;
const equipmentPoses=new Map();
function applyEquipmentPose(model,pose){if(!model||!pose)return;model.setFrontLoaderHeight(pose.lift/100);model.setFrontBucketTilt(THREE.MathUtils.degToRad(pose.tilt));model.setRearArmRotation(THREE.MathUtils.degToRad(pose.swing));model.setRearBoomAngle(THREE.MathUtils.degToRad(pose.boom));model.setRearStickAngle(THREE.MathUtils.degToRad(pose.stick));model.setRearBucketCurl(THREE.MathUtils.degToRad(pose.curl));model.update(0);}
function openGarage(i){
 releaseOrbit();
 if(garage.open)return;keys.clear();controls.clear();speed=0;if(index!==i){controls.setVehicleActions();choose(i);applyEquipmentPose(i===0?vehicle.userData.controller:null,equipmentPoses.get(i));}
 const changed=garageVehicle!==i;garageVehicle=i;garage.showModal();
 if(changed)garageFrame.src='./viewer/dirty.html?embedded=1&vehicle='+(i===0?'backhoe':'garbage');
 else garageFrame.contentWindow.postMessage({type:'garage:visibility',visible:true},location.origin);
}
function closeGarage(){if(!garage.open)return;garage.close();garageFrame.contentWindow.postMessage({type:'garage:visibility',visible:false},location.origin);keys.clear();controls.clear();speed=0;clock.getDelta();}
document.querySelector('#garageClose').onclick=closeGarage;
garage.addEventListener('cancel',event=>{event.preventDefault();closeGarage();});
function truckSnapshot(){
 const truck=garbage();truck.traverse(o=>{if(o.userData.wheel)o.userData={wheel:o.userData.wheel};});const json=truck.toJSON();
 const shared=new Set([green,road,yellow,yellowDark,orange,glass,rubber,metal,white,red]);const materials=new Set();truck.traverse(o=>{if(o.isMesh){o.geometry.dispose();if(!shared.has(o.material))materials.add(o.material);}});for(const material of materials)material.dispose();return json;
}
addEventListener('message',event=>{
 if(event.origin!==location.origin||event.source!==garageFrame.contentWindow)return;
 if(event.data?.type==='garage:ready')garageFrame.contentWindow.postMessage({type:'garage:init',vehicle:garageVehicle,model:garageVehicle===1?truckSnapshot():null,pose:equipmentPoses.get(garageVehicle),visible:garage.open},location.origin);
 if(!garage.open)return;
 if(event.data?.type==='garage:pose'&&garageVehicle===0){const pose=event.data.pose;const ranges={lift:[0,100],tilt:[-40,50],swing:[-65,65],boom:[-17,20],stick:[-37,43],curl:[-48,65]};if(!pose||Object.keys(ranges).some(k=>!Number.isFinite(pose[k])))return;const safe={};for(const [key,range] of Object.entries(ranges))safe[key]=THREE.MathUtils.clamp(pose[key],...range);equipmentPoses.set(0,safe);if(index===0)applyEquipmentPose(vehicle.userData.controller,safe);}
 if(event.data?.type==='garage:close')closeGarage();
});
const garageBindings=bindVehicleGarage({buttons:[document.querySelector('#backhoeBtn'),document.querySelector('#garbageBtn')],onSelect:i=>{if(!garage.open){controls.setVehicleActions();choose(i);applyEquipmentPose(i===0?vehicle.userData.controller:null,equipmentPoses.get(i));}},onOpen:openGarage});

let audio;

function unlockAudio(){try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{})}catch(e){}}

addEventListener('keydown',unlockAudio);addEventListener('pointerdown',unlockAudio);

function rockImpactSound(strength,kind){
  if(!audio||audio.state!=='running')return;
  try{const now=audio.currentTime,osc=audio.createOscillator(),gain=audio.createGain();osc.type='triangle';osc.frequency.setValueAtTime(kind==='break'?180:kind==='crack'?260:140,now);osc.frequency.exponentialRampToValueAtTime(65,now+.18);gain.gain.setValueAtTime(.035,now);gain.gain.exponentialRampToValueAtTime(.0001,now+.24);osc.connect(gain);gain.connect(audio.destination);osc.start(now);osc.stop(now+.25);osc.onended=()=>{osc.disconnect();gain.disconnect()};
