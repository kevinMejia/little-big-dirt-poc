 if(event.origin!==location.origin||event.source!==garageFrame.contentWindow)return;
 if(event.data?.type==='garage:ready')garageFrame.contentWindow.postMessage({type:'garage:init',vehicle:garageVehicle,model:garageVehicle===1&&!stinkyTemplate?truckSnapshot():null,pose:equipmentPoses.get(garageVehicle),visible:garage.open},location.origin);
 if(!garage.open)return;
 if(event.data?.type==='garage:pose'&&garageVehicle===0){const pose=event.data.pose;const ranges={lift:[0,100],tilt:[-40,50],swing:[-65,65],boom:[-17,20],stick:[-37,43],curl:[-48,65]};if(!pose||Object.keys(ranges).some(k=>!Number.isFinite(pose[k])))return;const safe={};for(const [key,range] of Object.entries(ranges))safe[key]=THREE.MathUtils.clamp(pose[key],...range);equipmentPoses.set(0,safe);if(index===0)applyEquipmentPose(vehicle.userData.controller,safe);}
 if(event.data?.type==='garage:pose'&&garageVehicle===1&&stinkyTemplate){const safe=sanitizeStinkyPose(event.data.pose);if(!safe)return;equipmentPoses.set(1,safe);if(index===1)applyStinkyPose(vehicle.userData.controller,safe);}
 if(event.data?.type==='garage:close')closeGarage();
});
document.querySelector('#vehicleSelect').addEventListener('change',event=>{
 const select=event.currentTarget,i=Number(select.value);
 if(!garage.open){controls.setVehicleActions();choose(i);applyEquipmentPose(vehicle.userData.controller,equipmentPoses.get(i));configureVehicleActions();}
 select.blur();
});
const garageBindings=bindVehicleGarage({buttons:[document.querySelector('#backhoeBtn'),document.querySelector('#garbageBtn'),document.querySelector('#rallyCarBtn')],onSelect:i=>{if(!garage.open){controls.setVehicleActions();choose(i);applyEquipmentPose(vehicle.userData.controller,equipmentPoses.get(i));configureVehicleActions();}},onOpen:openGarage});

function configureVehicleActions(){
 controls.setVehicleActions(index===1&&vehicle.userData.controller?.setHopper?stinkyActions(
  ()=>equipmentPoses.get(1)??{hopper:0,compactor:0},
  pose=>{equipmentPoses.set(1,pose);applyStinkyPose(vehicle.userData.controller,pose);}
 ):[]);
}

let stinkyQA;
if(new URLSearchParams(location.search).get('qa')==='stinky'){
 const {installStinkyQA}=await import('./viewer/stinky-world-qa.js');
 stinkyQA=installStinkyQA({trees:treeCollisions,rocks:rockInteractions,ramps:worldJumps.features,
  place(site){if(garage.open)closeGarage();choose(1);reset();keys.clear();controls.clear();position.set(site.x,surfaceHeight(site.x,site.z)-.09,site.z);heading=site.heading;vehicleRoot.position.copy(position);vehicleRoot.rotation.set(0,heading,0);if(rapierController)rapierController.resetAt(position,heading);configureVehicleActions();applyEquipmentPose(vehicle.userData.controller,equipmentPoses.get(1));},
  read(site){vehicleRoot.updateMatrixWorld(true);let error=0;for(const c of debrisContacts.wheels){const w=c.pivot.userData.wheel,p=c.pivot.getWorldPosition(new THREE.Vector3());error=Math.max(error,Math.abs(p.y-(surfaceHeight(p.x,p.z)+c.bump-.035+w.r)));}const model=vehicle.userData.controller;return [
   'Asset: '+(model?.setHopper?'stinky.glb':index===1?'procedural fallback':'Dirty'),
   'Physics: '+physicsMode+' | wheels: '+debrisContacts.wheels.length,
   'Position: '+position.x.toFixed(1)+', '+position.z.toFixed(1),
   'Speed: '+speed.toFixed(2)+' | airborne: '+!!flight,
   'Wheel contact error: '+error.toFixed(4)+' m'+' (ray suspension)',
   'Wheel angle: '+(model?.wheelAngle??0).toFixed(2),
   'Front steer: '+(model?.wheels?.find(w=>w.front)?.steering.rotation.y??0).toFixed(3),
   'Body roll: '+vehicleVisual.rotation.z.toFixed(4),
   'Equipment: '+JSON.stringify(equipmentPoses.get(1)??{hopper:0,compactor:0}),
   'Target state: '+(site.target?.state??'terrain'),
   'Tree hits: '+treeCollisions.trees.filter(t=>Number.isFinite(t.lastHit)).length+' | Rock hits: '+rockInteractions.rocks.filter(r=>Number.isFinite(r.lastHit)).length,
  ].join('\n');}
 });
}

// Gameplay audio routes through one shared mixer. Physics callbacks stay intact.
function rockImpactSound(strength,kind){gameAudio.rock(strength,kind);}
function treeImpactSound(strength,kind='wobble'){gameAudio.tree(strength,kind);}
function landingSound(impact){gameAudio.play(audioCannon?'cannon-land':'ramp-land',{intensity:Math.min(1,.35+impact/20),cooldown:.2});}
function honk(){gameAudio.horn();}

document.querySelector('#gameLoading').dataset.phase='turbo-assets';
await turboReady;
const turboStatus=document.createElement('div');turboStatus.id='turboStatus';turboStatus.hidden=true;turboStatus.setAttribute('aria-live','off');document.body.append(turboStatus);
// Safari can cache this live page on navigation; preserve its audio manager for return.
addEventListener('pagehide',event=>{if(event.persisted)gameAudio.stopAll(true);else gameAudio.dispose();});
const clock=new THREE.Clock(),camTarget=new THREE.Vector3(),targetPos=new THREE.Vector3(),up=new THREE.Vector3(0,1,0);

function update(dt){const previousHeading=heading;
if(audioVehicle!==index){audioAirborne=!!flight;audioVehicle=index;}

// Observe state transitions; never alter collision, flight or recovery state.
for(const tree of treeCollisions.trees){const previous=treeAudioStates.get(tree);if(previous==='FALLING'&&tree.state==='FALLEN')gameAudio.play('tree-thud',{cooldown:.15});if(previous==='FALLEN'&&tree.state==='RECOVERING')gameAudio.play('wood-creak',{cooldown:1.5,intensity:.35});treeAudioStates.set(tree,tree.state);}
const cfg=configs[index];treeCollisions.setVehicles([{position,heading,bounds:cfg.collision,airborne:!!flight}]);treeCollisions.update(dt);rockInteractions.setVehicles([{position,heading,bounds:cfg.collision,airborne:!!flight}]);rockInteractions.update(dt);const pad=navigator.getGamepads?.()[0];

const drivingInput=controls.read(speed,pad);
const forward=drivingInput.accelerate,back=drivingInput.reverse,emergencyBrake=drivingInput.emergencyBrake;
steer=smoothDrivingSteering(steer,drivingInput,cfg,dt);

let slope=0;



 const cannonBefore=rapierController.cannonFlight;
 const state=rapierController.update(dt,hybridDrivingInput(drivingInput,steer,rapierController.physics.state.airborne));
 if(window.driveProbeStats){const d=window.driveProbeStats;d.air+=state.airborne?dt:0;d.min=Math.min(d.min,state.speed);d.max=Math.max(d.max,state.speed);d.events.push(...state.events);}
 position.set(state.position.x,state.position.y,state.position.z);heading=state.heading;speed=state.speed;slope=state.grade;flight=state.airborne?{kind:'rapier',vy:state.verticalSpeed}:null;
 if(state.cannon&&!cannonBefore)gameAudio.play('cannon-boom',{cooldown:.3});
 audioCannon=cannonBefore||state.cannon;
 for(const event of state.events)if(event.type==='landing')hybridLandingFeedback(event,index,cfg,bodyFeedback,surfaceEffects,surfaceHeight,landingSound);

turboPickups?.update(dt,position,rapierController);
const boostRemaining=rapierController?.turbo.remaining??0;
turboStatus.hidden=boostRemaining<=0;
if(!turboStatus.hidden)turboStatus.textContent=`⚡ TURBO ${boostRemaining.toFixed(1)}s`;
if(!audioAirborne&&flight&&!audioCannon)gameAudio.play('ramp-takeoff',{cooldown:.3});
if(audioBoost>0&&boostRemaining<=0)gameAudio.play('turbo-expire',{cooldown:.3});
audioBoost=boostRemaining;audioAirborne=!!flight;
audioCannon=!!rapierController?.cannonFlight;
gameAudio.loop('air-wind',audioCannon,{intensity:.35});
gameAudio.engine(index,speed,cfg.max*getSpeedMultiplier(cfg.hill.speedAdjustmentPercent),forward||back,garage.open||document.hidden,!!flight);


 // Reuse legacy footprint/contact feedback with the new authored debris only.
 const debrisFeedback=debrisContacts.sample(vehicle,vehicleRoot,decorativeDebris??groundDebris,configs[index].hill,!!flight);
 if(!flight)bodyFeedback.update(dt,{speed,yawRate:(heading-previousHeading)/Math.max(dt,.001),groundY:0,groundPitch:0,groundRoll:0,config:configs[index].hill,debris:debrisFeedback});
 rapierController.render(vehicleRoot,vehicleVisual,bodyFeedback,dt);
 for(let i=0;i<debrisContacts.wheels.length;i++){
  const c=debrisContacts.wheels[i];c.compression=(rapierController.physics.state.compression[i]??0)+c.bump;
  if(c.bump){c.pivot.getWorldPosition(c.point);c.point.y+=c.bump;c.pivot.position.copy(c.pivot.parent.worldToLocal(c.point));}
 }

stinkyQA?.update(performance.now());
environmentWorld?.update();
polishedLighting.update(position);
contactShading.update(vehicleRoot,debrisContacts,!!flight);
surfaceEffects.update(dt,{position,speed,heading,airborne:!!flight,contacts:debrisContacts,camera,boosted:boostRemaining>0});

document.querySelector('#status').dataset.idle=String(!flight&&bodyFeedback.landingSeconds<=0&&!emergencyBrake);
document.querySelector('#status').textContent=flight?(!rapierController.cannonFlight?'AIRBORNE · Dirt jump':'BOUNDARY CANNON · Flying!'):bodyFeedback.landingSeconds>0?'Soft landing · Settling…':emergencyBrake?'EMERGENCY BRAKE · ENGAGED':'Keyboard or gamepad supported';

if(cameraOrbit.pointer===null){const decay=cameraReturnDecay(cameraSettings.cameraReturnSpeedPercent,dt);cameraOrbit.yaw*=decay;cameraOrbit.pitch*=decay;}
const cameraAnchor=vehicleRoot.position;
const orbitHeading=rapierController.cameraHeading+cameraOrbit.yaw,elevation=chaseElevation+cameraOrbit.pitch;
const rallyDistance=index===2?chaseDistance+4+Math.min(1,Math.abs(speed)*.01):chaseDistance;
camera.fov=THREE.MathUtils.damp(camera.fov,index===2?72+Math.min(6,Math.abs(speed)*.08):66,3,dt);camera.updateProjectionMatrix();
const behind=new THREE.Vector3(-Math.sin(orbitHeading)*Math.cos(elevation)*rallyDistance,2.4+Math.sin(elevation)*rallyDistance,-Math.cos(orbitHeading)*Math.cos(elevation)*rallyDistance);targetPos.copy(cameraAnchor).add(behind);camera.position.lerp(targetPos,1-Math.exp(-(cameraOrbit.pointer===null?4:12)*dt));camera.position.y=Math.max(camera.position.y,surfaceHeight(camera.position.x,camera.position.z)+1.3);camTarget.set(cameraAnchor.x,cameraAnchor.y+2.4,cameraAnchor.z);camera.lookAt(camTarget);

document.querySelector('#treeTuning').textContent='Physics: Rapier / Hybrid · Speed '+Math.round(Math.abs(speed)/cfg.max*100)+'% · Tree knockdown '+cfg.hill.treeKnockdownSpeedPercent+'% ('+(cfg.max*cfg.hill.treeKnockdownSpeedPercent/100).toFixed(1)+' units/s)';

document.querySelector('#speed').innerHTML=Math.round(Math.abs(speed)*2.237)+' <small>MPH</small>';document.querySelector('#terrainInfo').textContent=Math.abs(slope)>.03?(slope>0?'Climbing a hill':'Heading downhill'):'Explore the hills!';

}

// One movement controller; legacy saved modes cannot select another path.
try{
 const RAPIER=await loadWorldPhysics();
 rapierController=new RapierWorldVehicle(RAPIER,{surface:worldSurface,height:surfaceHeight,groundDebris,trees:treeCollisions,rocks:rockInteractions,limit:world-mapSettings.boundaryInset,bounds:typeof driveBounds==='object'?driveBounds:null});
 rapierController.setVehicle(vehicle,configs[index],index,position,heading);
 saveGamePreference(preferenceStorage,'physicsMode','rapier');
}catch(error){
 rapierController?.dispose();rapierController=null;
 const loading=document.querySelector('#gameLoading');loading.dataset.phase='physics-error';
 loading.querySelector('h2').textContent='Driving could not start';
 const retry=document.querySelector('#loadingRetry');retry.hidden=false;retry.textContent='Reload game';retry.onclick=()=>location.reload();
 throw error;
}

// Explicit browser QA mode; absent during normal play.
if(['rally-car','audi'].includes(new URLSearchParams(location.search).get('qa')))window.rallyCarQA=window.audiQA={
 assetInfo(){const textures=new Set(),geometry=new Set();rallyCarTemplate.traverse(o=>{if(o.isMesh){geometry.add(o.geometry);for(const m of Array.isArray(o.material)?o.material:[o.material])for(const v of Object.values(m))if(v?.isTexture)textures.add(v);}});return {geometry:geometry.size,textures:textures.size,loaded:[...textures].every(t=>t.image?.width>0&&t.image?.height>0)};},
 sites:worldJumps.features.map(f=>({x:f.x-48*Math.sin(f.angle),z:f.z-48*Math.cos(f.angle),heading:f.angle,id:f.id})),
 read(){const p=rapierController?.physics,m=vehicle.userData.controller;return {index,speed,heading,position:{x:position.x,y:position.y,z:position.z},airborne:!!flight,contacts:p?.state.contacts,compression:p?.state.compression,wheels:m?.wheels?.map(w=>({x:w.x,z:w.z,radius:w.radius,steer:w.steering.rotation.y,spin:w.spin?.rotation.x})),calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,memory:renderer.info.memory,fov:camera.fov};},
 place(x,z,h=0){reset();position.set(x,surfaceHeight(x,z)-.09,z);heading=h;rapierController?.resetAt(position,heading);},
 jump(){rapierController?.physics.impulse({x:0,y:12,z:18});if(rapierController)rapierController.physics.state.airborne=true;}
};

if(new URLSearchParams(location.search).get('qa')==='rally'&&rallyEnabled)window.rallyQA={
 track:rallyTrack,access:rallyAccess,landscape:rallyLandscape,surface:worldSurface,scenery:rallyPlacements,
 choose,place(u=0,access=false){const p=(access?rallyAccess:rallyTrack).at(u);position.set(p.x,p.y-.09,p.z);heading=Math.atan2(p.tx,p.tz);speed=steer=0;rapierController?.resetAt(position,heading);vehicleRoot.position.copy(position);},
 read(){return {index,speed,heading,position:{x:position.x,y:position.y,z:position.z},airborne:!!flight,near:rallyLandscape.nearest(position.x,position.z),calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,memory:renderer.info.memory,debug:rallyDebug};},
 debug:toggleTrackDebug,
 aerial(){cameraOrbit.pointer=-1;camera.position.set(world+190,390,210);camera.lookAt(world+190,8,0);},
 controller:()=>rapierController,
};

// BEGIN temporary uphill driving probe
if(window.rallyQA&&new URLSearchParams(location.search).has('driveProbe')){
 const probe=document.createElement('div');probe.style.cssText='position:fixed;z-index:99;top:80px;left:12px;background:#132f34ee;padding:10px;max-width:480px';
 const output=document.createElement('pre'),button=document.createElement('button');button.textContent='Uphill test';
 button.onclick=()=>{reset();window.rallyQA.place(.22);const start=rallyTrack.at(.22);camera.position.set(start.x-start.tx*20,start.y+8,start.z-start.tz*20);camera.lookAt(start.x,start.y+2.4,start.z);window.driveProbeStats={air:0,min:0,max:0,events:[]};button.blur();};probe.append(button,output);document.body.append(probe);
 setInterval(()=>{const q=window.rallyQA.read(),p=rapierController?.physics;output.textContent=JSON.stringify({car:q.index,speed:+q.speed.toFixed(2),y:+q.position.y.toFixed(2),u:+q.near.u.toFixed(4),edge:+(q.near.distance-q.near.width/2).toFixed(2),air:q.airborne,support:worldSurface.isContinuousRoad?.(q.position.x,q.position.z),mode:physicsMode,stats:window.driveProbeStats},null,2);},150);
}
// END temporary uphill driving probe
let diagnosticFrames=0,diagnosticStart=performance.now();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);wordHunt?.update(dt,vehicleRoot.position,garage.open||document.hidden);if(garage.open){gameAudio.stopAll();}if(!garage.open){update(dt);storybookBackground?.update(dt);groundTextures.update();groundDetails.update(camera.position);decorativeDebris?.update(camera.position);renderer.render(scene,camera);document.querySelector('#gameLoading').hidden=true;document.querySelector('#gameLoading').dataset.phase='ready';diagnosticFrames++;const now=performance.now();if(now-diagnosticStart>1000){if(document.body.classList.contains('show-debug'))document.querySelector('#renderTuning').textContent=Math.round(diagnosticFrames*1000/(now-diagnosticStart))+' FPS · '+renderer.info.render.calls+' draws · '+Math.round(renderer.info.render.triangles/1000)+'k triangles';diagnosticFrames=0;diagnosticStart=now;}}}animate();

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

</script></body></html>
